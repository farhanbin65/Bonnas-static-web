name: Blog Post Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser groq requests

      - name: Run pipeline
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          SANITY_PROJECT_ID:  ${{ secrets.VITE_SANITY_PROJECT_ID }}
          SANITY_DATASET:     ${{ secrets.VITE_SANITY_DATASET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: python scripts/generate_blog.py