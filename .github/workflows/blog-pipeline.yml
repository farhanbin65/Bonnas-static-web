name: Bonna's Blog Generator

on:
  schedule:
    # Monday, Wednesday, Friday at 08:00 UTC
    - cron: '0 8 * * 1,3,5'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq feedparser requests pillow python-dotenv

      - name: Run blog generator
        id: blog_gen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/generate_blog.py

      - name: Commit updated index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/topics.json scripts/post_index.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update blog index [skip ci]"
            git push
          else
            echo "No index changes to commit."
          fi
